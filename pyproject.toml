[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-notebook"
version = "0.1.0"
description = "MCP server that lets Claude read your notebooks on notebook.google.com via your own signed-in Chrome"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chad Keith" }]
keywords = ["mcp", "claude", "claude-code", "gemini-notebook", "playwright", "redaction"]

[project.urls]
Homepage = "https://github.com/chchchadzilla/claude-notebook"
Issues = "https://github.com/chchchadzilla/claude-notebook/issues"
dependencies = ["mcp>=2.3,<3", "playwright>=1.50"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
claude-notebook = "claude_notebook.server:main"

[tool.setuptools.packages.find]
where = ["src"]
